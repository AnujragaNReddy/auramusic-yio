# Static site — no server needed, just the built dist/ folder.
services:
  - type: web
    name: aura-music
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set the actual value in the Render dashboard after this deploys —
      # never put a real key in this file, since it gets committed to git.
      - key: VITE_YT_API_KEY
        sync: false
    routes:
      # React Router uses client-side routes (/discover, /artist/:id, etc.) —
      # without this, refreshing or linking directly to those paths 404s.
      - type: rewrite
        source: /*
        destination: /index.html
