# Static site — no server needed, just the built dist/ folder.
services:
  - type: web
    name: aura-music
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # React Router uses client-side routes (/discover, /artist/:id, etc.) —
      # without this, refreshing or linking directly to those paths 404s.
      - type: rewrite
        source: /*
        destination: /index.html
